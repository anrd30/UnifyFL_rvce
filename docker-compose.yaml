version: '3.8'

x-build: &ekatrafl_build
  build:
    context: .
    dockerfile: Dockerfile
  image: unifyfl

services:
  train_container_0:
    build: .
    image: unifyfl
    environment:
      - TRAIN_SET=0
    mem_limit: 1g
    restart: no
    network_mode: "host"
    volumes:
      - ./configs:/code/configs
      - ./unifyfl:/code/unifyfl
      - ./models:/code/models

  train_container_1:
    build: .
    image: unifyfl
    environment:
      - TRAIN_SET=1
    mem_limit: 1g
    restart: no
    network_mode: "host"
    volumes:
      - ./configs:/code/configs
      - ./unifyfl:/code/unifyfl
      - ./models:/code/models

  train_container_2:
    build: .
    image: unifyfl
    environment:
      - TRAIN_SET=2
    mem_limit: 1g
    restart: no
    network_mode: "host"
    volumes:
      - ./configs:/code/configs
      - ./unifyfl:/code/unifyfl
      - ./models:/code/models

  train_container_3:
    build: .
    image: unifyfl
    environment:
      - TRAIN_SET=3
      - IS_MALICIOUS=true
      - ATTACK_TYPE=label_flipping
    mem_limit: 1g
    restart: no
    network_mode: "host"
    volumes:
      - ./configs:/code/configs
      - ./unifyfl:/code/unifyfl
      - ./models:/code/models
